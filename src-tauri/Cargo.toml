[package]
name = "mc-ai-command-generator"
version = "0.1.0"
description = "AI 驱动的 Minecraft 通用指令生成器"
authors = ["ReQiao"]
edition = "2021"

[lib]
# `_lib` 后缀避免 Windows 上 lib 名与 bin 名冲突
# 见 https://github.com/rust-lang/cargo/issues/8519
name = "mc_ai_command_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls 避免依赖系统 openssl，跨平台更省心
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 启动时加载项目根目录的 .env（DASHSCOPE_API_KEY 等）
dotenvy = "0.15"
